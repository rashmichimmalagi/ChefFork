<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChefFork – Social Recipe Sharing & Recipe Forking</title>
    <meta name="description" content="ChefFork is the social network for amateur chefs and home cooks. Share recipes, discover culinary creations, and fork any recipe to craft your own unique twist." />
    <meta property="og:title" content="ChefFork – Social Recipe Sharing & Recipe Forking" />
    <meta property="og:description" content="ChefFork is the social network for amateur chefs and home cooks. Share recipes, discover culinary creations, and fork any recipe to craft your own unique twist." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('cheffork-theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#fdfbf7] dark:bg-[#121315] text-stone-900 dark:text-stone-100 antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
